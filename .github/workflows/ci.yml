name: ci

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false

  rubocop:
    name: Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  # No converters installed here, on purpose. The three hotcell gems claim to be testable with no toolchain and
  # no container, and a job that installed libvips would stop that claim from being checked.
  hotcell:
    name: "hotcell (ruby ${{matrix.ruby}})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "${{matrix.ruby}}"
          bundler-cache: true
      - run: bundle exec rake hotcell

  # The uncontainerized cell is the supported macOS development path, so the no-toolchain suite runs on a mac
  # too. It is advisory rather than a gate: the runners are slow and a timing-sensitive deadline test is
  # occasionally flaky there, and the memory clamp is unenforced because macOS has no finite RLIMIT_DATA. One
  # lane on one Ruby, because macOS runners bill at about ten times the Linux rate.
  hotcell-macos:
    name: "hotcell (macos, ruby 3.4)"
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake hotcell

  # These convert real images, PDFs and video rather than pretending to, so the converters have to be here.
  activestorage:
    name: "activestorage (ruby ${{matrix.ruby}})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the converters
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42 mupdf-tools poppler-utils ffmpeg imagemagick
      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "${{matrix.ruby}}"
          bundler-cache: true
      - run: bundle exec rake activestorage-hotcell-server activestorage-hotcell-client

