name: ci

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  rubocop:
    name: Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  # No converters installed here, on purpose. The three hotcell gems claim to be testable with no toolchain and
  # no container, and a job that installed libvips would stop that claim from being checked.
  hotcell:
    name: "hotcell (ruby ${{matrix.ruby}})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "${{matrix.ruby}}"
          bundler-cache: true
      - run: bundle exec rake test:hotcell

  # The uncontainerized cell is the supported macOS development path, so the no-toolchain suite runs on a mac
  # too. It is advisory rather than a gate: the runners are slow and a timing-sensitive deadline test is
  # occasionally flaky there, and the memory clamp is unenforced because macOS has no finite RLIMIT_DATA. One
  # lane on one Ruby, because macOS runners bill at about ten times the Linux rate.
  hotcell-macos:
    name: "hotcell (macos, ruby 3.4)"
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:hotcell

  # These convert real images, PDFs and video rather than pretending to, so the converters have to be here.
  activestorage:
    name: "activestorage (ruby ${{matrix.ruby}})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the converters
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42 mupdf-tools poppler-utils ffmpeg imagemagick
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "${{matrix.ruby}}"
          bundler-cache: true
      - run: bundle exec rake test:activestorage

  # The container and isolation path, covered for real. bin/example-image runs the installer and builds
  # what it wrote, so the scaffold an application actually gets is what is under test; bin/conformance then
  # drives the example battery through it from a second container, checking the descriptor crossing the
  # container boundary, network: none, cap-drop, no-new-privileges, the read-only root and the noexec tmpfs.
  # It then boots the same image without one of those flags at a time and requires the battery to fail at
  # that flag's own check, so the claim above is a test rather than an assertion. Those negative runs live in
  # the script rather than in this step, so an operator running it against their own image gets them too.
  conformance:
    name: "container conformance"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the example cell image from the installed scaffold
        run: bin/example-image
      - name: Conformance holds, and fails with any one security flag dropped
        run: bin/conformance hotcell:example

  # Provenance of the produced image: the cell is the boundary the application relies on, so what it ships
  # is gated the same way its behavior is. bin/example-image builds the installed scaffold, so this scans
  # the exact image an application would build. The setuid check holds the escalation gadgets out; the
  # Trivy scan fails the build on a fixable High or Critical rather than shipping one; the SBOM records
  # what went in, so a later CVE can be answered against a named bill of materials.
  image-scan:
    name: "image scan and SBOM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the example cell image from the installed scaffold
        run: bin/example-image
      - name: Assert the image carries no setuid or setgid binaries
        run: |
          # As root so the traversal is complete — a non-root find would skip unreadable directories and
          # could miss a gadget.
          gadgets="$(docker run --rm --user 0 --entrypoint sh hotcell:example -c 'find / -xdev -type f -perm /06000')"
          if [ -n "$gadgets" ]; then
            echo "the cell image ships setuid/setgid binaries it should have stripped:"
            echo "$gadgets"
            exit 1
          fi
      # `ignore-unfixed` gates on what a rebuild can actually fix: a fixable High or Critical means the base
      # has drifted behind an available patch, which `--pull` in bin/example-image resolves. Vulnerabilities
      # with no released fix would only be able to fail every unrelated PR until upstream ships one, so they
      # are reported by the SBOM below rather than blocking here. This is a fixable-vuln gate, not a claim of
      # zero Highs.
      - name: Scan the image for fixable High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hotcell:example
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Generate a CycloneDX SBOM of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hotcell:example
          scan-type: image
          format: cyclonedx
          output: hotcell-example.cdx.json
      - name: Publish the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotcell-example-sbom
          path: hotcell-example.cdx.json

